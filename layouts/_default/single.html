{{ define "main" }}
<div class="spotlight-card" style="padding: 3rem 2.5rem; max-width: 900px; margin: 0 auto;">
  <div style="margin-bottom: 2rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 1.5rem;">
    <a href="/" style="color: var(--accent-cyan); text-decoration: none; font-size: 0.82rem; font-weight: 700; display: inline-flex; align-items: center; gap: 0.4rem; margin-bottom: 1rem;">
      &larr; Back to Strategic Architecture
    </a>
    <h1 style="font-size: 2.5rem; font-weight: 800; color: #fff; letter-spacing: -0.03em;">{{ .Title }}</h1>
    {{ if .Date }}
    <span class="font-mono" style="font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase;">{{ .Date.Format "January 2, 2006" }}</span>
    {{ end }}
  </div>

  <div class="content-body" style="font-size: 1.05rem; line-height: 1.8; color: #cbd5e1;">
    {{ .Content }}
  </div>
</div>
{{ end }}
